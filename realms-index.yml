  url: https://github.com/embabel-worlds/realm-movie
  description: 'Movie recommendations grounded in what the user has rated, what''s actually streamable
    in their country, and live OMDb metadata. Ships three short Agent Skills — `recommend-movie` (pick
    something to watch / where can I stream X), `rate-movie` (record a rating), `recall-movies` (read
