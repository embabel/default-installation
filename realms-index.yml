- name: gov-uk
  source: https://github.com/embabel-worlds/realm-gov-uk.git
  url: https://github.com/embabel-worlds/realm-gov-uk
  description: 'United Kingdom public-register realm, beginning with Director Web: a free, evidence-linked
    navigator over Companies House officer records. Anchor an officer identifier and traverse every appointment
    it holds — `MATCH (o:UkOfficerRecord {officerId:''<id>''})-[:HELD_APPOINTMENT]->(a:UkAppointment)`
    — which returns each company''s name, number and status inline, so a whole passport is one call. Anchor
    a company number instead to expand it: `MATCH (c:UkCompany {companyNumber:''01234567''})` reaches
    its profile (HAS_PROFILE), its officers and their identifiers (HAS_OFFICER), its persons with significant
    control (HAS_PSC) and its gazette filings (HAS_FILING) — the only place the register states whether
    a dissolution was a voluntary or compulsory strike-off, since the status field has no strike-off value
    at all. Start from a name with `MATCH (s:UkOfficerSearch {query:''<name>''})-[:FOUND]->(c:UkOfficerCandidate)`,
    whose results are LEADS for a person to choose between and never an identity. Dates come in three
    states — exact, bounded (pre-1992 appointments give only an upper bound) and unknown — and a bound
    is never substituted for a date. Recurrence patterns are derived view results carrying the records
    behind them, never materialised judgments. Officer records that merely share a name are never merged,
    and an officer identifier is itself Companies House''s own grouping of underlying register entries
    rather than a raw filing. This realm reports what the register records and never characterises it:
    an appointment, a dissolution or a shared address is a sourced fact, not a finding.'
  version: 0.1.0
  author: Embabel
  tags:
  - government
  - companies-house
  - united-kingdom
  - open-data
  - transparency
  category: government
- name: grid
  source: https://github.com/embabel-worlds/realm-grid.git
  url: https://github.com/embabel-worlds/realm-grid
  description: 'When to run it. The carbon intensity of the electricity behind your sites, half-hour by
    half-hour, and the number that follows from it: how much CO2 you save by moving a flexible workload
    into the cleanest window of the day. Britain''s grid swings by a factor of three or four within a
    single day — the same kilowatt-hour can cost 60 gCO2 or 250 depending only on when it is drawn. Nightly
    builds, model training, batch ETL, fleet charging: none of them care what time they run, and almost
    nobody moves them, because nobody has the number in front of them. Name a site with its outward postcode.
    The realm reaches the regional intensity for that site right now, the national half-hourly curve for
    the day, and what is actually generating; the views turn that into the cleanest window and the kilograms
    saved by using it. Where realm-uk-streets is installed, every UkPlace you already watch gets the same
    treatment without being listed twice. One source: the UK National Grid ESO carbon intensity API, which
    is open, keyless, and needs no account.'
