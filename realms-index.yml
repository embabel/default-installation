- name: uk-streets
  source: https://github.com/embabel-worlds/realm-uk-streets.git
  url: https://github.com/embabel-worlds/realm-uk-streets
  description: 'Street-level Britain, joined at a place: police-recorded crime, every registered property
    sale since 1995, the House Price Index, ONS median pay, Census 2021 ethnicity, schools, food-hygiene
    ratings, live flood alerts, and each place''s MP with the seat''s latest margin — eleven keyless official
    sources queryable as one graph, anchored on `UkPlace`s you watch at two zoom levels (a full postcode
    for street level, an outcode for the district). The official ONS district crime table adds a NATIONAL
    cross-section: every local authority''s recorded-crime rate per 1,000 residents, rankable and joinable
    to pay. Cross-source views answer what no single register can: CrimeVsIncome, CrimeVsIncomeAcrossDistricts,
    DistrictCrimeLeague, IncomeByParty, SeatsAndMargins, PriceTrendAtMyPlaces, WhereNotToEat, PlaceDossier.
    The Street Lens app (`apps/street-lens.html`) puts it all on a map of Britain — a dossier per dot.
    The COMMUNITY axis reads what a place-based data platform copies in — school readiness, youth justice
    first-time entrants, NEET, children in low income, under-18 conceptions, childhood obesity, life expectancy
    (OHID Fingertips, with the publisher''s own "compared to England" on every row), the claimant count
    and population by age (NOMIS), the Indices of Deprivation 2025, and DfE early-years, absence and KS4
    results — live, dated, at the authority. The ORGANISATION axis makes the unit an organisation rather
    than a statistic: every charity declaring the place as an area of operation and its daily register
    record and event history (Charity Commission), every published grant into the district and who received
    it (360Giving), and the register record behind any recipient identifier (Find that Charity). Views:
    PlaceProfile, WhereThisPlaceStandsOut, SmartInsights (ranked against every authority in England, with
    a dial), IndicatorTrendAtPlace, IndicatorAcrossEngland, MostDeprivedDistricts2025, CharitiesOperatingHere,
    CharityChangesHere, WhoFundsThisPlace, FundedOrganisationsHere, SchoolReadinessAtPlace, Ks4AttainmentAtPlace
    and more. Three DERIVE rule sets conclude what no query can: charity succession and lineage from the
    Commission''s event log, and money regranted through a publishing intermediary from 360Giving. The
    Community Profile app (`apps/community-profile.html`) puts a place''s profile on one page. No API
    keys and no accounts — the realm works the moment it is installed.'
  version: 0.4.0
  author: rod
  tags:
  - united-kingdom
  - crime
  - open-data
  - maps
  - apps
  category: government
- name: wikidata
  source: https://github.com/embabel-worlds/realm-wikidata.git
  url: https://github.com/embabel-worlds/realm-wikidata
  description: 'Wikidata enrichment realm — the open knowledge graph joined onto your organizations and
    people. Anchor an organization you already know (`MATCH (o:Organization {name:''Atlassian''})-[:HAS_WIKIDATA]->(w:WikidataOrg)`)
    and read what the world''s most heavily curated public graph records about it: industry, country,
