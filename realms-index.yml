  category: security
- name: filings
  source: https://github.com/embabel-worlds/realm-filings.git
  url: https://github.com/embabel-worlds/realm-filings
  description: 'What the companies you depend on just told their regulator. A public company cannot quietly
    change its chief executive, restate its accounts, take on debt, lose a major customer or enter a material
    agreement: within four business days it must file an 8-K saying so. Those filings are free, machine-readable,
    and almost nobody watches them — so a supplier''s going-concern warning or a customer''s CFO departure
    reaches you through the trade press weeks later, if at all. Name the tickers you care about and why.
    The realm reaches every filing each of them has made, decodes the 8-K item codes into what actually
    happened using a catalog it ships as data, and ranks by how much the event type matters rather than
    by date — so a restatement two months old outranks a routine shareholder vote from yesterday. One
    source: the SEC''s own EDGAR full-text search. Open, keyless, no account. US-listed filers only, which
    is a real limit and the realm says so rather than returning silence for a company that simply does
    not file there.'
  version: 0.1.0
  author: rod
  tags:
  - filings
  - counterparty-risk
  - sec
  - edgar
  - openapi
  - apps
  - handlers
  category: compliance
- name: fr-streets
  source: https://github.com/embabel-worlds/realm-fr-streets.git
  url: https://github.com/embabel-worlds/realm-fr-streets
  description: 'France, joined at a commune — keyless official sources queryable as ONE graph, keyed on
    the INSEE code (never the postal code, which is many-to-many with communes): police- and gendarmerie-recorded
    crime for every commune 2016-2025 (SSMSI, 15 indicators) and every departement (homicides included,
    nothing suppressed); median standard of living, poverty and INEQUALITY (INSEE Filosofi 2023); immigrant
    share, age structure and population (census 2012-2023); density; property prices per m2 for flats
    and houses in every commune (Etalab DVF statistics); the mayor (after the March 2026 municipales)
    and the departement''s deputies; census unemployment and qualifications (2023); the official European-election
    result of 9 June 2024 in every commune, all 38 lists by panel number, never grouped or labelled by
    the realm; and Eurostat''s regional statistics for France AND its neighbours (GDP and household income
    per head in PPS, unemployment, life expectancy, median age, population, density, since 2012) on one
    European yardstick. Ask about ANY commune — (:FrCommune {code}), (:FrMelodiPlace {geo}), (:FrDeptRef
    {code}), any European region (:EuRegion {code}) — or the places you watch (:FrPlace). National cross-sections
    hang off (:FrCrimeSlice), (:FrDeptCrimeSlice), (:FrCommunes {set:''france''}), (:FrDepartements {set:''france''})
    and (:FrHousingScale), so places can be ranked, trended and modelled across France. Views — places:
    FrPlaceDossier, FrCrimeAtMyPlaces, FrCrimeTrendAtPlace, FrDeputiesAtMyPlaces; any commune: FrCommuneSnapshot,
    FrCommuneCrime, FrCommuneContext; housing: FrHousingAffordability, FrDeptHousing; crime: FrNationalTrend,
    FrDepartementLeague, FrCrimeLeague, FrCrimeMovers; models: FrDepartementModel, FrDepartementPredictorsOneByOne,
    FrDepartementRows, FrWhatBestPredictsCrime, FrCrimePredictorsOneByOne, FrCommunesRanked, FrModelRows;
    across borders: EuBorderRegions. Honest limits, carried into every view: France publishes NO geolocated
    crime and nothing below the commune (bar Paris/Lyon/Marseille arrondissements); a commune''s crime
    is published only after >5 facts in each of 3 consecutive years; France collects no ethnic statistics,
    so "immigre" (born abroad, not French at birth) is the closest published measure; DVF excludes Alsace-Moselle
    and Mayotte. Models describe places, never people. No API keys and no accounts - the realm works the
    moment it is installed.'
  version: 0.4.0
  author: rjohnson
  tags:
  - france
  - open-data
  - crime
  - housing
  - census
  - insee
  - elections
  - eurostat
