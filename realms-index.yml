# GENERATED by scripts/build-realms-index.py — do not edit. Every field below is the
# realm's own manifest speaking, so a `maturity` claim here is the author's, not a
# curator's opinion. Regenerate when a realm is published, retired, or changes its claim.
#
# `categories` is realm-categories.yml, the authoritative list; a realm's `category` is on it
# or is not carried.
#
# Public repositories only: a private realm's clone URL is no use to anybody who cannot
# see it. An appliance with a token still finds those by scanning directly.
