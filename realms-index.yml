  description: 'Sustainability disclosure intelligence. Spider an organization''s published material,
    chunk it into a corpus, and extract TYPED, CITED observations — a number where the standard asks for
    a number, a narrative where it asks for a narrative, and an explicit "not disclosed" where the material
    is silent. Observations are framework-NEUTRAL: one observed fact (`Scope 1 = 12,400 tCO2e, FY2024`)
