- name: astrology
  source: https://github.com/embabel-worlds/realm-astrology.git
  url: https://github.com/embabel-worlds/realm-astrology
  description: 'Natal charts, transits and the sky over anything you have a timestamp for. The ephemeris
    is in the realm''s own bundle, so a chart needs no network, no key and no account: positions from
    astronomy-engine, which agrees with NASA JPL Horizons to under an arcsecond on a planet, and houses,
    ascendant and — the thing that is actually hard — the birthplace''s historical time zone from deepnatal,
    which refuses to cast a chart rather than guess at a daylight-saving hole or a pre-standard-time zone.
    Everything is a Virtual Cypher hop from a pinned key, so a chart is a query and a REST call rather
    than only a page: pin a BirthMoment for the chart, its placements, its aspects and its cusps; a TransitDay
    for what the sky is doing to it; a SkyMoment for the sky over any instant at all, which is how a commit,
    a failed build or a closed deal gets a sky over it. What makes it unusual is that it tells you how
    good it is. Every chart carries how far its two independent ephemerides disagreed, whether Placidus
    had to be abandoned for the latitude, whether another time zone is defensible for those coordinates,
    and whether an unknown birth time leaves the Moon''s sign undecided. And VERIFIED_BY audits the arithmetic
    against NASA, live, for any chart — so the numbers are checkable rather than merely confident. Keyless.
    Nothing to configure.'
  version: 0.1.0
  author: Rod Johnson
  tags:
  - astrology
  - astronomy
  - ephemeris
  - virtual-cypher
  - nasa
  maturity: experimental
  category: lifestyle
- name: au-donations
  source: https://github.com/embabel-worlds/realm-au-donations.git
  url: https://github.com/embabel-worlds/realm-au-donations
  description: 'Australian political donations realm — the AEC Transparency Register''s annual disclosure
    returns (1998–99 to today) as a governed, graph-queryable relational store. Anchor an entity (`MATCH
    (e:DonorEntity {name:''…''})-[:MADE_DONATION]->(d:Donation)`) and traverse who gave, who received,
    receipts, and debts — then chain outward: the ABN column joins the Australian Business Register and
    Wikidata; the entity name joins live AusTender contracts and the federal lobbyist register (realm-gov-au);
    ownership and press arrive via Diffbot. This realm is a PROVISIONED-STORE realm: the AEC publishes
    bulk files with no query API, so the realm ships the recipe for its own backing database — docker-compose
    + schema + loader — and declares the datasource it expects. The datasource is READ-ONLY three ways:
    no `readOnly: false` in the declaration (the platform refuses writes), the JDBC session hint, and
    a SELECT-only database role. The register reports what entities disclosed; a disclosure is a sourced
    fact, never a finding.'
  version: 0.1.0
  author: Rod Johnson
  tags:
