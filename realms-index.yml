    the readings the Actions tab cannot: the recurring failure themes, the jobs that pass on retry, and
    the paragraph to take into a standup. One source: the GitHub REST API, read-only, with a token that
    can read Actions on the repositories you ask about. Public repositories work with any token; private
    ones need a token granted on them. Pin a repository as GitHubRepository {full_name:''owner/repo''}
    and traverse. The anchor is the same label realm-github uses, so a world with both installed sees
