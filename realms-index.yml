    language on demand via (o:EsgObservation)-[:OF_DATAPOINT]->(d:EsgDatapoint)-[:SATISFIES]->(r:EsgRequirement)-[:IN_FRAMEWORK]->(f:EsgFramework).
    Every observation carries the chunk it came from, so a citation can be CHECKED rather than asserted.
